<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jacob Luttrull | Backend Software Engineer{% endblock %}</title>
    <meta name="description" content="{% block description %}Jacob Luttrull's backend software portfolio.{% endblock %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/redesign.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
</head>
<body class="{% if request.url.path.startswith('/admin') %}admin-site{% else %}public-site{% endif %}">
    {% if not request.url.path.startswith('/admin') %}<a class="skip-link" href="#main-content">Skip to content</a>{% endif %}
    <header class="site-header">
        <div class="site-container header-inner">
            <a class="site-brand" href="/" aria-label="Jacob Luttrull, home">JACOB LUTTRULL</a>
            <nav class="desktop-nav" aria-label="Main navigation">
                <a class="{% if active_page == 'home' %}active{% endif %}" {% if active_page == 'home' %}aria-current="page"{% endif %} href="/">Home</a>
                <a class="{% if active_page == 'projects' %}active{% endif %}" {% if active_page == 'projects' %}aria-current="page"{% endif %} href="/projects">Projects</a>
                <a class="{% if active_page == 'contact' %}active{% endif %}" {% if active_page == 'contact' %}aria-current="page"{% endif %} href="/contact">Contact</a>
            </nav>
            <div class="header-actions">
                <span class="availability">Open to work</span>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
            <details class="mobile-nav">
                <summary>Menu</summary>
                <nav aria-label="Mobile navigation">
                    <a href="/">Home</a>
                    <a href="/projects">Projects</a>
                    <a href="/contact">Contact</a>
                </nav>
            </details>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <div class="site-container footer-inner">
            <span>&copy; 2026 Jacob Luttrull</span>
            <a class="footer-connect" href="/#connect">Find me online ↑</a>
        </div>
    </footer>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
